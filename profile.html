<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/game-studio/" />
    <title>个人资料 · 社区游戏工坊</title>
  <script type="module" crossorigin src="/game-studio/assets/profile-BF9D226Z.js"></script>
  <link rel="modulepreload" crossorigin href="/game-studio/assets/auth-Cc0fEKrL.js">
  <link rel="stylesheet" crossorigin href="/game-studio/assets/auth-wobqEDeW.css">
</head>
<body>
    <div id="app">
        <div class="top-nav">
            <div class="nav-left">
                <a href="studio.html" class="nav-link">← 返回工坊</a>
                <h2>👤 个人资料</h2>
            </div>
            <div class="nav-right">
                <div class="user-badge">
                    <div class="avatar-sm" id="navAvatar">👤</div>
                    <span class="user-name" id="navUserName">玩家</span>
                </div>
                <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
            </div>
        </div>

        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="avatar-large" id="avatarLarge">👤</div>
                    <div class="profile-info">
                        <h2 id="profileName">未命名</h2>
                        <div class="id-badge" id="profileId">#------</div>
                        <p id="profileBio">这个人很懒，什么都没写。</p>
                        <span id="roleBadge" class="role-badge">👤 玩家</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <input type="file" id="avatarUpload" accept="image/*" style="display:none;" />
                    <button class="btn btn-primary" id="changeNameBtn">✏️ 改名</button>
                    <button class="btn btn-outline" id="changeAvatarBtn">🖼️ 换头像</button>
                    <button class="btn btn-outline" id="editBioBtn">✏️ 简介</button>
                    <button class="btn btn-outline" id="refreshBtn">🔄 刷新</button>
                </div>

                <div id="renameModal" class="modal-overlay hidden">
                    <div class="modal-box">
                        <h3>✏️ 修改名字</h3>
                        <p style="color:#6b7a8f;font-size:13px;">输入新的名字（2-20个字符）</p>
                        <input type="text" id="newNameInput" class="form-input" placeholder="新名字" style="width:100%;margin:8px 0;" />
                        <div style="display:flex;gap:8px;justify-content:center;">
                            <button class="btn btn-primary" id="confirmNameBtn">确认</button>
                            <button class="btn btn-outline" id="cancelNameBtn">取消</button>
                        </div>
                    </div>
                </div>

                <div id="adminPanel" class="profile-section hidden">
                    <h4>⚙️ 游戏管理</h4>
                    <div style="margin-top:12px;">
                        <div id="adminGameList"></div>
                    </div>
                </div>

                <div class="profile-section">
                    <h4>🎨 头像框</h4>
                    <div class="frame-selector" id="frameSelector">
                        <span class="frame-item active" data-frame="default">默认</span>
                        <span class="frame-item" data-frame="gold">✨ 黄金</span>
                        <span class="frame-item locked" data-frame="diamond">💎 钻石</span>
                        <span class="frame-item locked" data-frame="legend">🏆 传说</span>
                    </div>
                </div>

                <div class="profile-section">
                    <h4>🏆 象棋段位排行榜</h4>
                    <div id="chessRankList" style="margin-top:8px;max-height:200px;overflow-y:auto;">
                        <div style="color:#6b7a8f;font-size:14px;">加载中...</div>
                    </div>
                </div>

                <div class="profile-section">
                    <h4>🏆 围棋段位排行榜</h4>
                    <div id="goRankList" style="margin-top:8px;max-height:200px;overflow-y:auto;">
                        <div style="color:#6b7a8f;font-size:14px;">加载中...</div>
                    </div>
                </div>

                <div class="profile-section">
                    <h4>📊 我的游戏</h4>
                    <div id="myGameList" style="margin-top:8px;">
                        <div style="color:#6b7a8f;font-size:14px;">暂无游戏</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
