<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>游戏工坊 · 社区游戏工坊</title>
    <link rel="stylesheet" href="src/style.css" />
</head>
<body>
    <div id="app">
        <div class="top-nav">
            <div class="nav-left">
                <h2>🎮 游戏工坊</h2>
            </div>
            <div class="nav-right">
                <div class="user-badge" id="userBadge">
                    <div class="avatar-sm" id="navAvatar">👤</div>
                    <span class="user-name" id="navUserName">玩家</span>
                </div>
                <a href="profile.html" class="btn btn-outline btn-sm" id="profileLink">👤 个人资料</a>
                <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
            </div>
        </div>

        <div class="studio-container">
            <div class="studio-sidebar">
                <div class="sidebar-menu">
                    <button class="menu-item active" id="menuAll">🎯 全部游戏</button>
                    <button class="menu-item" id="menuMy">📌 可游玩</button>
                    <button class="menu-item" id="menuAdmin">⚙️ 管理</button>
                </div>
                <div class="sidebar-info">
                    <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 刷新</button>
                    <span id="gameCount" style="font-size:12px;color:#6b7a8f;display:block;margin-top:8px;">加载中...</span>
                </div>
            </div>

            <div class="studio-content">
                <div class="panel">
                    <div class="panel-header">
                        <h3 id="panelTitle">🎯 全部游戏</h3>
                        <span class="badge" id="panelCount">0 个</span>
                    </div>
                    <div class="panel-body">
                        <div class="game-grid" id="gameList">
                            <div style="text-align:center;color:#6b7a8f;padding:40px 0;">加载游戏中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="gameModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">游戏</h3>
                <button class="btn btn-outline btn-sm" id="modalClose">✕</button>
            </div>
            <div class="modal-body">
                <iframe id="gameFrame" src="about:blank" style="width:100%;height:500px;border:none;border-radius:16px;background:#0f1620;"></iframe>
            </div>
        </div>
    </div>

    <script type="module" src="src/studio.ts"></script>
</body>
</html>
