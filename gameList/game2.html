<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            color: #e8edf5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, sans-serif;
        }
        .game-container { text-align: center; padding: 30px; }
        .click-area {
            width: 300px; height: 300px;
            background: #1a212c;
            border-radius: 30px;
            border: 2px solid #2a3340;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
            margin: 20px auto;
            user-select: none;
        }
        .click-area:hover { border-color: #4c6ef5; }
        .click-area:active { transform: scale(0.95); }
        .count { font-size: 72px; font-weight: 700; color: #b388ff; }
        .label { font-size: 16px; color: #6b7a8f; margin-top: 8px; }
        .btn {
            padding: 10px 24px; border: none; border-radius: 30px;
            background: #4c6ef5; color: white; font-size: 14px;
            cursor: pointer; transition: 0.2s;
        }
        .btn:hover { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="game-container">
        <h2>🖱️ 点击大师</h2>
        <div class="click-area" id="clickArea">
            <div class="count" id="countDisplay">0</div>
            <div class="label">👆 点击我</div>
        </div>
        <button class="btn" id="resetBtn">重置</button>
        <div style="margin-top:12px;color:#6b7a8f;font-size:13px;">⏱️ 看看你能点多少下！</div>
    </div>
    <script>
        let count = 0;
        const display = document.getElementById('countDisplay');
        const area = document.getElementById('clickArea');
        area.addEventListener('click', () => { count++; display.textContent = count; });
        document.getElementById('resetBtn').addEventListener('click', () => { count = 0; display.textContent = '0'; });
    </script>
</body>
</html>
